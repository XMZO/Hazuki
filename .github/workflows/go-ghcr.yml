name: Build and Publish Hazuki Go

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-ghcr.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test Go code
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Run tests
        working-directory: go
        run: go test ./...

  build-binary:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            platform: linux/amd64
          - goarch: arm64
            platform: linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build ${{ matrix.platform }} binary
        working-directory: go
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags "-s -w" -o dist/hazuki-go ./cmd/hazuki
          sha256sum dist/hazuki-go > dist/hazuki-go.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hazuki-go-linux-${{ matrix.goarch }}
          path: |
            go/dist/hazuki-go
            go/dist/hazuki-go.sha256
          if-no-files-found: error

  publish-image:
    name: Publish ${{ matrix.platform }} image
    needs: build-binary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            platform: linux/amd64
          - goarch: arm64
            platform: linux/arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: hazuki-go-linux-${{ matrix.goarch }}
          path: go/dist

      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hazuki-go" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./go
          file: ./go/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image.outputs.name }}:build-${{ github.sha }}-${{ matrix.goarch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.goarch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.goarch }}

      - name: Save image digest
        shell: bash
        run: echo "${{ steps.build.outputs.digest }}" > digest-${{ matrix.goarch }}.txt

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: hazuki-go-digest-${{ matrix.goarch }}
          path: digest-${{ matrix.goarch }}.txt
          if-no-files-found: error

  publish-manifest:
    name: Publish multi-arch manifest
    needs: publish-image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hazuki-go" >> "$GITHUB_OUTPUT"

      - name: Download amd64 digest
        uses: actions/download-artifact@v4
        with:
          name: hazuki-go-digest-amd64
          path: digests

      - name: Download arm64 digest
        uses: actions/download-artifact@v4
        with:
          name: hazuki-go-digest-arm64
          path: digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Create and push multi-arch manifest
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          amd64_digest="$(cat digests/digest-amd64.txt)"
          arm64_digest="$(cat digests/digest-arm64.txt)"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create \
              --tag "$tag" \
              "${IMAGE_NAME}@${amd64_digest}" \
              "${IMAGE_NAME}@${arm64_digest}"
          done <<< "$IMAGE_TAGS"

      - name: Inspect published manifest
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}:latest"
