{{define "setup"}}
  <div class="auth">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="/assets/avatar.png" alt="" width="56" height="56" />
        <div>
          <div class="auth-title">{{.Title}}</div>
          <div class="auth-sub">{{.T "setup.subtitle"}} <code>HAZUKI_ADMIN_USERNAME</code> / <code>HAZUKI_ADMIN_PASSWORD</code>.</div>
        </div>
      </div>
      <form method="post" action="/setup" class="stack">
        <div class="field">
          <label class="label" for="setup-user">{{.T "auth.username"}}</label>
          <input id="setup-user" type="text" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus />
        </div>
        <div class="field">
          <label class="label" for="setup-pw">{{.T "setup.password"}}</label>
          <input id="setup-pw" type="password" name="password" autocomplete="new-password" minlength="8" required />
        </div>
        <button class="btn primary" type="submit">{{.T "setup.createAndLogin"}}</button>
      </form>
      <div class="auth-alt"><a href="/login">{{.T "setup.backToLogin"}}</a></div>
    </div>
  </div>
{{end}}
