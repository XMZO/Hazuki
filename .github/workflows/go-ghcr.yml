name: Build and Publish Hazuki Go

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-ghcr.yml"
  workflow_dispatch:

jobs:
  build-binary:
    name: Build Linux binary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Run tests
        working-directory: go
        run: go test ./...

      - name: Build linux/amd64 binary
        working-directory: go
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags "-s -w" -o dist/hazuki-go ./cmd/hazuki
          sha256sum dist/hazuki-go > dist/hazuki-go.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hazuki-go-linux-amd64
          path: |
            go/dist/hazuki-go
            go/dist/hazuki-go.sha256
          if-no-files-found: error

  publish-image:
    name: Publish GHCR image
    needs: build-binary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: hazuki-go-linux-amd64
          path: go/dist

      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hazuki-go" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./go
          file: ./go/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
