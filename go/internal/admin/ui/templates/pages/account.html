{{define "account"}}
  <div class="page">
    <header class="page-head">
      <div class="page-head-text">
        <h1 class="page-title">{{.Title}}</h1>
        <p class="page-desc">{{.T "account.currentUser"}}：<code>{{.User.Username}}</code>{{.T "account.currentUserSuffix"}}</p>
      </div>
    </header>

    <form class="card narrow m0" method="post" action="/account/password" data-hz-pjax>
      <div class="card-head">
        <div class="card-head-text">
          <div class="card-title"><svg class="icon"><use href="#i-lock"/></svg>{{.T "account.changePassword"}}</div>
          <div class="card-sub">{{.T "account.passwordMinLength"}}</div>
        </div>
      </div>
      <input type="text" name="username" value="{{.User.Username}}" autocomplete="username" hidden />
      <div class="fields one">
        <div class="field">
          <label class="label" for="acc-cur">{{.T "account.currentPassword"}}</label>
          <input id="acc-cur" type="password" name="currentPassword" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label class="label" for="acc-new">{{.T "account.newPassword"}}</label>
          <input id="acc-new" type="password" name="newPassword" autocomplete="new-password" minlength="8" required />
        </div>
      </div>
      <div class="card-foot">
        <button class="btn primary" type="submit">{{.T "common.save"}}</button>
      </div>
    </form>
  </div>
{{end}}
