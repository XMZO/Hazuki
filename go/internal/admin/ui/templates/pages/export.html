{{define "export"}}
  <div class="page">
    <header class="page-head">
      <div class="page-head-text">
        <h1 class="page-title">{{.T "nav.versions"}}</h1>
        <p class="page-desc">{{.T "export.subtitle"}}</p>
      </div>
    </header>
    {{template "backupTabs" .}}

    <form class="card narrow m0" method="post" action="/config/export">
      <div class="field">
        <span class="label">{{.T "export.keyModeLabel"}}</span>
        <div class="hint">{{.T "export.keyModeHint"}}</div>
        <div class="choices" style="margin-top:6px">
          <label class="choice">
            <input type="radio" name="keyMode" value="master" {{if .MasterKeyIsSet}}checked{{end}} />
            <span>
              <span class="choice-title">{{.T "export.keyModeMaster"}}</span>
              {{if not .MasterKeyIsSet}}<span class="hint" style="display:block">{{.T "export.masterKeyMissing"}}</span>{{end}}
            </span>
          </label>
          <label class="choice">
            <input type="radio" name="keyMode" value="password" {{if not .MasterKeyIsSet}}checked{{end}} />
            <span class="choice-title">{{.T "export.keyModePassword"}}</span>
          </label>
        </div>
      </div>

      <div class="fields form-note">
        <div class="field">
          <label class="label" for="ex-pw">{{.T "export.passwordLabel"}}</label>
          <input id="ex-pw" type="text" class="secret" name="password" value="" placeholder="{{.T "export.passwordPlaceholder"}}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore="true" data-form-type="other" />
          <div class="hint">{{.T "export.passwordHint"}}</div>
        </div>
        <div class="field">
          <label class="label" for="ex-pw2">{{.T "export.passwordConfirmLabel"}}</label>
          <input id="ex-pw2" type="text" class="secret" name="password2" value="" placeholder="{{.T "export.passwordConfirmPlaceholder"}}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore="true" data-form-type="other" />
        </div>
      </div>

      <div class="card-foot">
        <button class="btn primary" type="submit" data-confirm-submit="{{.T "export.confirm"}}" data-confirm-ok="{{.T "export.download"}}"><svg class="icon"><use href="#i-download"/></svg>{{.T "export.download"}}</button>
      </div>
    </form>
  </div>
{{end}}
