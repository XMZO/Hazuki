{{define "themeToggle"}}
<button class="icon-btn theme-btn" type="button" data-theme-toggle aria-label="{{.T "layout.theme"}}" title="{{.T "layout.theme"}}">
  <svg class="icon i-auto"><use href="#i-contrast"/></svg>
  <svg class="icon i-light"><use href="#i-sun"/></svg>
  <svg class="icon i-dark"><use href="#i-moon"/></svg>
</button>
{{end}}

{{define "langSwitch"}}
<div class="segmented mini" role="group" aria-label="{{.T "layout.language"}}">
  <a class="seg {{if .IsLang "zh"}}active{{end}}" href="/lang?to=zh" data-no-pjax="1" hreflang="zh">中文</a>
  <a class="seg {{if .IsLang "en"}}active{{end}}" href="/lang?to=en" data-no-pjax="1" hreflang="en">EN</a>
</div>
{{end}}

{{define "copyChip"}}
<button class="chip" type="button" data-hz-copy="1" data-hz-copy-text="{{.Text}}" title="{{.Title}}"><svg class="icon"><use href="#i-link"/></svg><span class="chip-text">{{.Text}}</span><svg class="icon"><use href="#i-copy"/></svg></button>
{{end}}
